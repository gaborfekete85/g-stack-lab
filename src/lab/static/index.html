<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>g-stack lab · todos</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
      form { display: flex; gap: 0.5rem; }
      input[type='text'] { flex: 1; padding: 0.4rem; }
      ul { list-style: none; padding: 0; }
      li { display: flex; gap: 0.5rem; align-items: center; padding: 0.3rem 0; }
      li.done span { text-decoration: line-through; color: #888; }
    </style>
  </head>
  <body>
    <h1>Todos <small id="remaining" data-testid="remaining"></small></h1>
    <form id="add">
      <input type="text" name="title" placeholder="What needs doing?" aria-label="New todo" />
      <button type="submit">Add</button>
    </form>
    <ul id="list" data-testid="list"></ul>

    <script>
      const list = document.getElementById('list')
      const remaining = document.getElementById('remaining')

      async function fetchTodos() {
        const res = await fetch('/todos')
        return res.json()
      }

      function renderList(todos) {
        list.innerHTML = ''
        for (const todo of todos) {
          const li = document.createElement('li')
          li.className = todo.done ? 'done' : ''
          const box = document.createElement('input')
          box.type = 'checkbox'
          box.checked = todo.done
          box.setAttribute('aria-label', `Toggle ${todo.title}`)
          box.addEventListener('change', async () => {
            await fetch(`/todos/${todo.id}/toggle`, { method: 'POST' })
            const todos = await fetchTodos()
            renderList(todos)
            renderRemaining(todos)
          })
          const span = document.createElement('span')
          span.textContent = todo.title
          li.append(box, span)
          list.append(li)
        }
      }

      function renderRemaining(todos) {
        const open = todos.filter((t) => !t.done).length
        remaining.textContent = `(${open} left)`
      }

      document.getElementById('add').addEventListener('submit', async (e) => {
        e.preventDefault()
        const input = e.target.elements.title
        const res = await fetch('/todos', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ title: input.value }),
        })
        if (res.ok) input.value = ''
        const todos = await fetchTodos()
        renderList(todos)
        renderRemaining(todos)
      })

      fetchTodos().then((todos) => {
        renderList(todos)
        renderRemaining(todos)
      })
    </script>
  </body>
</html>
